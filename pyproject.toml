[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airjam"
version = "0.3.0"
description = "Play a drum kit in the air - webcam hand tracking, real drum sounds, zero dependencies beyond the obvious."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ankita Salaria" }]
keywords = ["webcam", "mediapipe", "drums", "audio", "hand-tracking", "air-gestures"]

[project.optional-dependencies]
run = ["mediapipe>=0.10", "opencv-python", "sounddevice"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airjam = ["models/*.task"]
